services:
  db:
    image: postgres:16-alpine
    container_name: agp_is_postgres
    restart: unless-stopped
    environment:
      # Kredensial diambil dari .env. Default "postgres/postgres" hanya
      # untuk dev lokal -- di produksi WAJIB diisi di .env, kalau tidak
      # database publik berjalan dengan password yang bisa ditebak.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agp_is}
    # Hanya dibuka ke localhost. Tanpa "127.0.0.1:", Docker membuka port
    # ini ke seluruh internet dan menembus firewall UFW -- database jadi
    # bisa diserang langsung dari luar.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agp_is_pgdata:/var/lib/postgresql/data
    # Batasi ukuran log. Tanpa ini log Docker tumbuh tanpa batas dan bisa
    # memenuhi disk -- disk penuh berisiko merusak data PostgreSQL.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dijalankan lewat profile "production" supaya "docker compose up -d" untuk
  # dev lokal (npm run dev + db saja) tidak berubah kebiasaannya. Untuk uji
  # image production secara lokal: `docker compose --profile production up -d --build`.
  app:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agp_is_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-agp_is}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Bukti transfer & nota pelunasan disimpan di Object Storage supaya
      # tidak ikut hilang saat container di-redeploy.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Notifikasi error ke Discord/Telegram/Slack (opsional).
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    # Aplikasi diakses lewat reverse proxy (Caddy/Nginx) yang memegang
    # sertifikat HTTPS, jadi porta ini tidak perlu terbuka ke internet.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Cadangan kalau Object Storage belum dikonfigurasi: berkas bukti
      # tetap bertahan antar redeploy. Begitu S3 aktif, volume ini praktis
      # tidak terpakai.
      - agp_is_uploads:/app/storage/uploads
    # Batasi ukuran log. Tanpa ini log Docker tumbuh tanpa batas dan bisa
    # memenuhi disk -- disk penuh berisiko merusak data PostgreSQL.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  agp_is_pgdata:
  agp_is_uploads:
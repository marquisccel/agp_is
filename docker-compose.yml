services:
  db:
    image: postgres:16-alpine
    container_name: agp_is_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agp_is
    ports:
      - "5432:5432"
    volumes:
      - agp_is_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agp_is_pgdata: